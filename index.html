<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome Forge · 图片转 3D 铬金属</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<aside id="panel">
  <h1>Chrome Forge</h1>
  <p class="hint">把平面黑色图案"充气"成 3D 铬金属。图片只在本地浏览器处理。</p>

  <div class="row">
    <label class="btn primary">选择图片<input id="file" type="file" accept="image/*" hidden></label>
    <button id="demo" class="btn">示例图</button>
  </div>
  <canvas id="preview" width="240" height="140" title="二值化预览(白色=将被做成立体)"></canvas>

  <h2>形状提取</h2>
  <label>阈值 <output id="o-threshold"></output><input id="threshold" type="range" min="10" max="245" value="128"></label>
  <label class="check"><input id="invert" type="checkbox"> 反相(图案是亮色/深色背景)</label>
  <label>边缘平滑 <output id="o-soften"></output><input id="soften" type="range" min="0" max="6" value="1" step="1"></label>
  <label>网格精度 <output id="o-res"></output>
    <select id="res"><option>256</option><option>384</option><option selected>512</option><option>768</option><option>1024</option></select>
  </label>

  <h2>立体化</h2>
  <label>充气半径 <output id="o-radius"></output><input id="radius" type="range" min="2" max="80" value="22"></label>
  <label>厚度 <output id="o-depth"></output><input id="depth" type="range" min="0.2" max="2.5" value="1" step="0.05"></label>
  <label>液态平滑 <output id="o-smooth"></output><input id="smooth" type="range" min="0" max="120" value="30" step="2"></label>

  <h2>材质</h2>
  <label>反射环境
    <select id="env"><option value="chrome">铬(高对比)</option><option value="studio">暗棚</option><option value="soft">柔光银</option></select>
  </label>
  <label>粗糙度 <output id="o-rough"></output><input id="rough" type="range" min="0" max="0.4" value="0.03" step="0.01"></label>
  <label>金属着色 <input id="tint" type="color" value="#ffffff"></label>
  <label>背景 <input id="bg" type="color" value="#ffffff"></label>
  <label class="check"><input id="transparent" type="checkbox"> 透明背景(PNG 导出)</label>
  <label class="check"><input id="spin" type="checkbox"> 自动旋转</label>

  <h2>导出</h2>
  <div class="row">
    <button id="png" class="btn">PNG</button>
    <button id="glb" class="btn">GLB</button>
    <button id="stl" class="btn">STL</button>
  </div>
  <p id="stats" class="hint"></p>
</aside>
<main id="stage"><div id="busy" hidden>生成中…</div></main>
<script type="module" src="src/main.js"></script>
</body>
</html>
